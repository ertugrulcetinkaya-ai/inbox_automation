name: Inbox automation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock

      - name: Install runtime and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install bandit pip-audit ruff

      - name: Compile Python sources
        run: python -m compileall -q main.py telegram_listener.py mail_digest tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Lint
        run: ruff check mail_digest main.py telegram_listener.py scripts tests

      - name: Static security checks
        # B108 is the mandated stable /tmp flock rendezvous path; B608 is
        # constructed only from internal SQLite table/column constants.
        run: bandit -q -r mail_digest main.py telegram_listener.py -ll -s B108,B608

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.lock
