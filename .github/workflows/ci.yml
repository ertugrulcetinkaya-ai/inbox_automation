name: Inbox automation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock

      - name: Install runtime and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install bandit pip-audit ruff

      - name: Compile Python sources
        run: python -m compileall -q main.py telegram_listener.py mail_digest tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Lint
        run: ruff check mail_digest main.py telegram_listener.py scripts tests

      - name: Static security checks
        # B108 is the mandated stable /tmp flock rendezvous path; B608 is
        # constructed only from internal SQLite table/column constants.
        run: bandit -q -r mail_digest main.py telegram_listener.py -ll -s B108,B608

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.lock

  macos-smoke:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Compile AppleScript transport
        run: osacompile -o "$RUNNER_TEMP/mail_fetcher.scpt" mail_fetcher.applescript

      - name: Render and lint launchd plists
        run: |
          mkdir -p "$RUNNER_TEMP/launchd"
          python - <<'PY'
          from pathlib import Path

          from scripts.install_launchd import TEMPLATES, render_template

          output = Path(__import__("os").environ["RUNNER_TEMP"]) / "launchd"
          for name, template in TEMPLATES.items():
              (output / f"{template.stem}").write_bytes(render_template(template))
          PY
          for plist in "$RUNNER_TEMP"/launchd/*.plist; do
            plutil -lint "$plist"
          done

      - name: Run macOS transport smoke tests
        run: python -m unittest tests.test_architecture tests.test_source_boundary -v
