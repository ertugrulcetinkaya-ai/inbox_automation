[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Keep the repository gate focused on syntax, imports, undefined names, and
# other correctness errors. The existing code intentionally keeps a small
# compatibility facade in main.py; formatting/style migration can be done
# separately without weakening runtime checks.
select = ["E4", "E7", "E9", "F"]
